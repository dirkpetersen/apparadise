# Hardware targets: the single source of truth for architecture flags.
# cuda_version (major.minor) names images (base-builder:13.0-rtx); cuda_full is the exact
# toolkit in the NGC base image and in Spack's cuda external.
# base_digests: fill in after pushing the base images (podman push --digestfile); every
# job then builds FROM tag@digest, so a rebuilt base never changes an old recipe silently.
# Read by the recipe templates (tools/render-recipe), the runbooks and, in phase 2,
# the recipe generators. tests/web/test_targets.py checks this file.
#
# Rules (architecture doc, "Hardware targets and build matrix"):
# - build natively on a CPU of the matching architecture, never under emulation;
# - always embed PTX for the highest CUDA arch, so newer GPUs can JIT;
# - prefer family targets (f suffix) over arch-specific ones (a suffix).

# EasyBuild recipes are bumped to one platform toolchain generation (architecture doc, rule 4)
# and use the base image's CUDA instead of building their own (filter-deps: CUDA). Q22.
# Newest first (Q22, Q34, owner): recipes start with the first; the toolchain-fallback repair
# moves to the next on a concretize failure, and after the last to the easyconfig's own.
easybuild_toolchains: ["foss,2026.1", "foss,2025b"]

# E4S binary cache release used as a second Spack mirror, signed by E4S (Q35, owner).
# Expect few hits: E4S builds against its own CUDA, and the hash must match exactly.
e4s_release: "26.06"

vr:
  title: Vera Rubin NVL72
  platform: linux/arm64
  cuda_version: "13.0"
  cuda_full: "13.0.3"  # NGC tag nvcr.io/nvidia/cuda:13.0.3-{devel,runtime}-ubuntu24.04
  # Rubin's compute capability is not published yet (QUESTIONS.md Q13). Read it from the
  # hardware with `nvidia-smi --query-gpu=compute_cap` and fill these in; vr builds refuse
  # to start while cuda_arch is null.
  cuda_arch: null
  ptx_arch: null
  # Vera's Olympus cores (Armv9.2) are not in archspec yet; neoverse_v2 (Grace, Armv9.0)
  # code runs on them. Switch to the Vera target once Spack/GCC know it (Q13).
  spack_target: neoverse_v2
  easybuild_optarch: "GCC:-mcpu=neoverse-v2"
  compiler_min: "GCC 16.1 or Clang 21 for Olympus tuning; GCC 14 for neoverse-v2"
  base_digests: {builder: null, runtime: null}

rtx:
  title: RTX PRO 6000 Blackwell farm
  platform: linux/amd64
  cuda_version: "13.0"
  cuda_full: "13.0.3"
  cuda_arch: ["120"]
  ptx_arch: "120"
  spack_target: x86_64_v4
  # Always the full flag: a bare "x86-64-v4" becomes "-x86-64-v4" (FAILURES.md #15).
  easybuild_optarch: "GCC:-march=x86-64-v4"
  compiler_min: "GCC 13"
  base_digests: {builder: null, runtime: null}

generic:
  title: Portable fallback
  platform: [linux/amd64, linux/arm64]
  # CUDA 13.0 for every target; Volta (sm_70, V100) is dropped, as CUDA 13 cannot build it
  # (Q6, Q38, owner, 2026-11-01).
  cuda_version: "13.0"
  cuda_full: "13.0.3"
  cuda_arch: ["75", "80", "86", "89", "90", "100", "120"]
  ptx_arch: "120"
  spack_target: {linux/amd64: x86_64_v3, linux/arm64: aarch64}
  easybuild_optarch: {linux/amd64: "GCC:-march=x86-64-v3", linux/arm64: "GCC:-march=armv8.2-a"}
  compiler_min: "GCC 13"
  # generic is multi-arch: pin the manifest-list digest
  base_digests: {builder: null, runtime: null}
