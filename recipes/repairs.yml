# Known-patch library for bounded auto-repair (phase 4, apparadise.repair).
#
# When a build fails, the first rule whose `match` (a Python regex, case-insensitive) finds
# the failure's scrubbed error line, at one of its `stages`, for the build's source, queues
# ONE repaired build of the same release. At most repair.max_attempts (default 2) repaired
# builds per release, never the same rule twice; every attempt is recorded on the failure
# record and in the audit log. Prefer toolchain-level fixes over per-file patches
# (docs/lessons/easybuild-host-build.md).
#
# Actions per source:
#   spack:      {spec_append: "<spec fragment>"}            appended to the Spack spec
#   easybuild:  {eb_options: {<eb option>: <value|null>}}   easystack options; null drops one
#   easybuild:  {next_toolchain: true}                      next try-toolchain in the chain
#   any source: {switch_source: true}                       next source with a CUDA recipe
#
# Seeded from the bare-metal EasyBuild session (FAILURES.md #13, #17, #19-21) and the
# failures CUDA builds hit most often. The gnulib/glibc _Generic clash (#20, #21) has no rule:
# -std=gnu17 does not fix it, and the forced include that does needs a file in the builder
# image (Q31, docs/operations/easybuild-troubleshooting.md).
#
# EasyBuild: the compiler-level fixes are Spack-only for now. --try-amend reaches only the
# top-level easyconfig (not the robot-resolved dependency that failed), replaces a
# parameter instead of extending it, and splits values on commas (Q30).

- id: binutils-gprofng
  why: gprofng does not compile against glibc 2.42+ (_Generic macros); nothing needs it
  match: 'all-gprofng|gprofng.*(_Generic|error)'
  stages: [build]
  actions:
    # the dependency, not the root package (^ in a Spack spec)
    spack: {spec_append: "^binutils~gprofng"}

- id: c23-old-code
  why: GCC 15 defaults to C23, where bool/true/false are keywords; old code typedefs them
  match: "cannot be defined via typedef|two or more data types in declaration specifiers|expected identifier or .\\(. before .(bool|true|false)."
  stages: [build]
  actions:
    # == propagates the flag to every dependency, wherever the old code is
    spack: {spec_append: "cflags==-std=gnu17"}

- id: kokkos-cuda-wrapper
  why: Kokkos with +cuda and GCC needs nvcc_wrapper (Spack raises InstallError otherwise)
  match: 'requires \+wrapper when using \+cuda'
  stages: [build]
  actions:
    spack: {spec_append: "+wrapper"}

- id: easybuild-toolchain-fallback
  why: the try-toolchain bump found no matching dependencies; try the next older generation
    in containers/targets.yml (easybuild_toolchains), and after the last one the toolchain
    the easyconfig names (Q22, Q34). May repeat until the chain is used up.
  match: "no easyconfig found|missing dependencies|tweak|no such toolchain|failed to process easyconfig"
  stages: [concretize]
  actions:
    easybuild: {next_toolchain: true}

- id: spack-unsatisfiable
  why: Spack cannot concretize this spec on this target; another source may have it
  match: "concretization failed|unsatisfiable|cannot satisfy|no version satisfies"
  stages: [concretize]
  actions:
    spack: {switch_source: true}

- id: conda-solve-failed
  why: the conda-forge solve found no CUDA build for this arch; Spack or EasyBuild may
  match: "could not solve|cannot solve the request|nothing provides|no candidates were found"
  stages: [concretize]
  actions:
    pixi: {switch_source: true}
